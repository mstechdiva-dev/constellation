name: Keepalive

# GitHub can pause scheduled workflows in a public repo after 60 days with no activity.
# Once a month this re-enables the Update workflow through the API, so no commit is needed
# and the protected main branch is never touched. Merging a pull request also counts as activity.
on:
  schedule:
    - cron: '17 6 12 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the Update workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
